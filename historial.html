        <script>
            function diasDelMesYAñoActual() {
                var fecha = new Date();
                return new Date(fecha.getFullYear(), fecha.getMonth() + 1, 0).getDate();
            }

            function mes_sig(){
                if (localStorage.getItem("fechainicial") === null && localStorage.getItem("fechafinal") === null) {
                    var date = new Date();
                }else{
                    var fecfin = localStorage.getItem("fechafinal");
                    var date = new Date(fecfin);   
                    //le quitamos 15 dias para q no falle en febrero
                    date.setDate(date.getDate() -15);

                }

                // Añadimos un mes
                date.setMonth(date.getMonth() + 1);

                var primerDia = new Date(date.getFullYear(), date.getMonth(), 1);
                var fecini = primerDia.getFullYear() + "-" + ("0"+(primerDia.getMonth()+1)).slice(-2) + "-" + ("0" + primerDia.getDate()).slice(-2);

                var ultimoDia = new Date(date.getFullYear(), date.getMonth() + 1, 0);   
                var fecfin = ultimoDia.getFullYear() + "-" + ("0"+(ultimoDia.getMonth()+1)).slice(-2) + "-" + ("0" + ultimoDia.getDate()).slice(-2);

                localStorage.setItem('fechainicial',fecini);
                localStorage.setItem('fechafinal',fecfin);

                window.location.assign('historial.html');



            }

            function mes_ant(){
                if (localStorage.getItem("fechainicial") === null && localStorage.getItem("fechafinal") === null) {
                    var date = new Date();
                }else{
                    var fecfin = localStorage.getItem("fechafinal");
                    var date = new Date(fecfin);    
                    //le quitamos 15 dias para q no falle en febrero
                    date.setDate(date.getDate() -15);



                }

                // quitamos un mes
                date.setMonth(date.getMonth() - 1);


                var primerDia = new Date(date.getFullYear(), date.getMonth(), 1);
                var fecini = primerDia.getFullYear() + "-" + ("0"+(primerDia.getMonth()+1)).slice(-2) + "-" + ("0" + primerDia.getDate()).slice(-2);

                var ultimoDia = new Date(date.getFullYear(), date.getMonth() + 1, 0);   
                var fecfin = ultimoDia.getFullYear() + "-" + ("0"+(ultimoDia.getMonth()+1)).slice(-2) + "-" + ("0" + ultimoDia.getDate()).slice(-2);

                localStorage.setItem('fechainicial',fecini);
                localStorage.setItem('fechafinal',fecfin);

                window.location.assign('historial.html');



            }


        </script>

                        <script>
                            if (localStorage.getItem("fechainicial") === null && localStorage.getItem("fechafinal") === null) {

                                var date = new Date();
                                var primerDia = new Date(date.getFullYear(), date.getMonth(), 1);
                                var fecini = primerDia.getFullYear() + "-" + ("0"+(primerDia.getMonth()+1)).slice(-2) + "-" + ("0" + primerDia.getDate()).slice(-2);

                                var ultimoDia = new Date(date.getFullYear(), date.getMonth() + 1, 0);   
                                var fecfin = ultimoDia.getFullYear() + "-" + ("0"+(ultimoDia.getMonth()+1)).slice(-2) + "-" + ("0" + ultimoDia.getDate()).slice(-2);



                            }else{
                                var fecini = localStorage.getItem("fechainicial")
                                var fecfin = localStorage.getItem("fechafinal");
                                var date = new Date(fecfin);
                            }


                            var este_year = date.getFullYear();
                            var mes_numero = date.getMonth();
                            if(mes_numero == 0){
                                mes_letra = 'Enero';
                            }if(mes_numero == 1){
                                mes_letra = 'Febrero';
                            }if(mes_numero == 2){
                                mes_letra = 'Marzo';
                            }if(mes_numero == 3){
                                mes_letra = 'Abril';
                            }if(mes_numero == 4){
                                mes_letra = 'Mayo';
                            }if(mes_numero == 5){
                                mes_letra = 'Junio';
                            }if(mes_numero == 6){
                                mes_letra = 'Julio';
                            }if(mes_numero == 7){
                                mes_letra = 'Agosto';
                            }if(mes_numero == 8){
                                mes_letra = 'Septiembre';
                            }if(mes_numero == 9){
                                mes_letra = 'Octubre';
                            }if(mes_numero == 10){
                                mes_letra = 'Noviembre';
                            }if(mes_numero == 11){
                                mes_letra = 'Diciembre';
                            }
                            var titulo = document.getElementById('mes').innerHTML = mes_letra+" "+este_year;



                            var id_usuario = localStorage.getItem('id_user');

                            var db = new Dexie("armenta");
                            db.version(1).stores({
                                rolmaestromisionesUNIQUE : 'rolmaestroid, rolmarcaid, rolidtienda, rolidordentrabajo, fechahoracreacionvisitarol, fechaprogramadavisitarol, horaprogramadavisitarol, usuarioidcreadorrol, colaboradoridasignadorol, fechayhorasubida, geosubida'
                            });

                            /*buscamos el rango de fechas */    

                            db.rolmaestromisionesUNIQUE.where('fechaprogramadavisitarol').between(fecini,fecfin,true,true).each(function (despliega) { 


                                var fecha_rol = despliega.fechaprogramadavisitarol;
                                var id_tienda = despliega.rolidtienda;
                                var id_colaborador = despliega.colaboradoridasignadorol;
                                var f_h_subida = despliega.fechayhorasubida; 

                                if(id_colaborador == id_usuario && f_h_subida != "0000-00-00 00:00:00" ){

                                    /* solo enseñamos los roles del colaborador */

                                    var db = new Dexie("armenta");
                                    db.version(1).stores({
                                        tienda : 'tiendaid, nombretienda, ubicaciontienda, geotienda, encargadotienda, documentoslista, cadenaidtienda'
                                    });

                                    db.tienda.get({tiendaid:parseInt(id_tienda)}).then(function (check) { 

                                        var nombre_tienda = check.nombretienda;     



                                        var Zone = document.getElementById('lista');

                                        var elemli = document.createElement('li');    
                                        Zone.appendChild(elemli);

                                        var elemh4 = document.createElement('h6');    
                                        elemh4.innerHTML = fecha_rol;
                                        elemli.appendChild(elemh4);

                                        var br = document.createElement('br');    
                                        elemli.appendChild(br);
                                        elemli.appendChild(br);

                                        var divcard = document.createElement('div');  
                                        divcard.setAttribute("class", "card");  
                                        elemli.appendChild(divcard);

                                        var divcardbody = document.createElement('div');  
                                        divcardbody.setAttribute("class", "card-body");  
                                        divcard.appendChild(divcardbody);

                                        var parr = document.createElement('p');  
                                        parr.setAttribute("class", "card-text");  
                                        parr.innerHTML = nombre_tienda;
                                        divcardbody.appendChild(parr);

                                        var it = document.createElement('i');  
                                        it.style.position = "absolute";  
                                        it.style.right = "5vw";      
                                        parr.appendChild(it);

                                        var imagen = document.createElement('img');  
                                        imagen.src = "xd/check.png";  
                                        it.appendChild(imagen);    

                                        elemli.appendChild(br);


                                    }).catch(function (error) {
                                        console.error(error);
                                    });     

                                }

                            }).catch(function (error) {
                                console.error(error);
                            });
