                    <script>
                        // Initialize and add the map
                        function initMap() {
                            
                            var direcciones = localStorage.getItem('geotiendasdia'); 
                            var arreglo_uno = direcciones.split("*");
                            
                            x = 0;
                            size = arreglo_uno.length;
                            
                            var locations = [];
                            
                            while (x < size){
                                var arreglo_dos = arreglo_uno[x].split(",");
                                var latitud = parseFloat(arreglo_dos[0]);
                                var longitud = parseFloat(arreglo_dos[1]);
                                
                                locations.push( ['Tienda'+x,latitud,longitud,x]);
                                
                                x++;
                            }
                                                        
                            
                            

                            // The location of CDMX
                            var place = {lat: 19.3910038, lng: -99.2836988};
                            
                            // The map, centered at CDMX
                            var map = new google.maps.Map(
                            document.getElementById('map'), {zoom: 11, center: place});
                            
                            // The marker, of place
                            //var marker = new google.maps.Marker({position: place, map: map, title: 'Tienda 1'});
                            

                            var marker, i;

                            for (i = 0; i < locations.length; i++) {  
                                marker = new google.maps.Marker({
                                    position: new google.maps.LatLng(locations[i][1], locations[i][2]),
                                    map: map
                                });

                                google.maps.event.addListener(marker, 'click', (function(marker, i) {
                                    return function() {
                                        infowindow.setContent(locations[i][0]);
                                        infowindow.open(map, marker);
                                    }
                                })(marker, i));
                            }

                            
                            
                        }
                    </script>
                    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCeICE07-uXPm0hzT2ph6M4FaGL9IgmOSI&callback=initMap"
