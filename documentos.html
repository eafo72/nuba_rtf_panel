            <div class="row " >
                <br><br>
                <div id="zone" class="col-12 ">
                    <br>

                    <script>
                        var db = new Dexie("armenta");
                        db.version(1).stores({
                            tienda : 'tiendaid, nombretienda, ubicaciontienda, geotienda, encargadotienda, documentoslista, cadenaidtienda'
                        });

                        db.tienda.each(function (check) { 

                            var id_tienda  = check.tiendaid;
                            var documentos = check.documentoslista;
                            var nombre_tienda = check.nombretienda;

                            if (documentos != ''){
                                var zona = document.getElementById('zone');

                                var divcard = document.createElement('div');
                                divcard.setAttribute("class", "card");     
                                zona.appendChild(divcard);

                                var attr = document.createElement('a');
                                attr.href = "";     
                                attr.setAttribute("data-toggle", "modal");
                                attr.setAttribute("data-target", "#archivos"+id_tienda);
                                divcard.appendChild(attr);

                                var divcardbody = document.createElement('div');
                                divcardbody.setAttribute("class", "card-body text-center");     
                                attr.appendChild(divcardbody);

                                var elemp = document.createElement('p');
                                elemp.setAttribute("class", "card-text");     
                                elemp.innerHTML = nombre_tienda;
                                divcardbody.appendChild(elemp);

                                var elemi = document.createElement('i');
                                elemi.style = "position: absolute; right:5vw;";     
                                elemp.appendChild(elemi);

                                var elemib = document.createElement('i');
                                elemib.setAttribute("class", "fa fa-eye");
                                elemib.setAttribute("aria-hidden", "true");
                                elemi.appendChild(elemib);

                                //modal
                                var divmodalfade = document.createElement('div');
                                divmodalfade.setAttribute("class", "modal fade");
                                divmodalfade.id = "archivos"+id_tienda;
                                divmodalfade.setAttribute("tabindex", "-1");
                                divmodalfade.setAttribute("role", "dialog");
                                divmodalfade.setAttribute("aria-labelledby", "myModalLabel");
                                divmodalfade.style = "z-index:99999;";
                                zone.appendChild(divmodalfade);

                                var divmodaldialog = document.createElement('div');
                                divmodaldialog.setAttribute("class", "modal-dialog");
                                divmodaldialog.setAttribute("role", "document");
                                divmodalfade.appendChild(divmodaldialog);

                                var divmodalcontent = document.createElement('div');
                                divmodalcontent.setAttribute("class", "modal-content");
                                divmodalcontent.style = "background:white";
                                divmodaldialog.appendChild(divmodalcontent);

                                var divmodalheader = document.createElement('div');
                                divmodalheader.setAttribute("class", "modal-header");
                                divmodalcontent.appendChild(divmodalheader);

                                var modalh4 = document.createElement('h4');
                                modalh4.setAttribute("class", "modal-title");
                                modalh4.innerHTML = "Documentos:";                            
                                divmodalheader.appendChild(modalh4);

                                var modalbtn = document.createElement('button');
                                modalbtn.setAttribute("type", "button");
                                modalbtn.setAttribute("class", "close");
                                modalbtn.setAttribute("data-dismiss", "modal");
                                modalbtn.setAttribute("aria-label", "Close");
                                divmodalheader.appendChild(modalbtn);

                                var modalspan = document.createElement('span');
                                modalspan.setAttribute("aria-hidden", "true");
                                modalspan.innerHTML = "&times;";
                                modalbtn.appendChild(modalspan);

                                var divmodalbody = document.createElement('div');
                                divmodalbody.setAttribute("align", "center");
                                divmodalbody.setAttribute("class", "modal-body");
                                divmodalbody.style = "padding-top:10px";
                                divmodalcontent.appendChild(divmodalbody);                       
                                var subidos = documentos.split(",");    
                                var size = subidos.length;    
                                i = 0;
                                while (i < size-1){
                                    arch = subidos[i];

                                    var attr = document.createElement('a');
                                    attr.href = "assets/documentos/"+arch;
                                    attr.setAttribute("target", "_blank");
                                    attr.setAttribute("data-toggle", "tooltip");
                                    attr.setAttribute("data-placement", "top");
                                    attr.setAttribute("title", "Ver/Descargar");
                                    attr.style = "font-size:14px;line-height: .5em;";           attr.innerHTML = arch;
                                    divmodalbody.appendChild(attr);

                                    var brk = document.createElement('br');
                                    divmodalbody.appendChild(brk);

                                   

                                    i++;
                                }       



                            }
                        }).catch(function (error) {
                            console.error(error);
                        }); 
                    </script>
