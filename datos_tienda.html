                    <script>
                        var nombre_tienda = localStorage.getItem('nombretienda');
                        var id_tienda = localStorage.getItem('idtienda');
                        document.getElementById('tienda').innerHTML = nombre_tienda;

                        var db = new Dexie("armenta");
                        db.version(1).stores({
                            tienda : 'tiendaid, nombretienda, ubicaciontienda, geotienda, encargadotienda, documentoslista, cadenaidtienda' 
                        });

                        /* buscamos datos tienda */    
                        db.tienda.get(parseInt(id_tienda)).then(function (check) {

                            var direccion = check.ubicaciontienda; 
                            var documentos = check.documentoslista; 


                            document.getElementById('direccion').innerHTML = direccion;
                            document.getElementById('documentos').innerHTML = documentos;

                            var db = new Dexie("armenta");
                            db.version(1).stores({
                                rolmaestromisiones : 'rolmaestroid, rolmarcaid, rolidtienda, rolidordentrabajo, fechahoracreacionvisitarol, fechaprogramadavisitarol, horaprogramadavisitarol, usuarioidcreadorrol, colaboradoridasignadorol, fechayhorasubida, geosubida' 
                            });


                            var id_usuario = localStorage.getItem('id_user');
                            //hoy
                            var hoy = new Date();
                            var var_hoy = hoy.getFullYear() + "-" + ("0"+(hoy.getMonth()+1)).slice(-2) + "-" + ("0" + hoy.getDate()).slice(-2);
                            /* buscamos roles del colaborador con la tienda */ db.rolmaestromisiones.where({colaboradoridasignadorol:parseInt(id_usuario), fechayhorasubida:"0000-00-00 00:00:00", fechaprogramadavisitarol:var_hoy,rolidtienda :parseInt(id_tienda)}).each(function (despliega) {  

                                var id_marca = despliega.rolmarcaid;

                                var db = new Dexie("armenta");
                                db.version(1).stores({
                                    marcas : 'marcaid, marclienteid, nombremarca, descripcionmarca, tipomarca, nomarca' 
                                });

                                // buscamos datos marca     
                                db.marcas.get(id_marca).then(function (check3) {

                                    var nombre_marca = check3.nombremarca;

                                    var zona_marcas = document.getElementById('brand_zone');

                                    var elemp = document.createElement('p');
                                    elemp.innerHTML = nombre_marca;
                                    zona_marcas.appendChild(elemp);




                                }).catch(function (error) {
                                    console.error(error);
                                });     
                            }).catch(function (error) {
                                console.error(error);
                            });  


                        }).catch(function (error) {
                            console.error(error);
                        });     




                    </script>  
                    <script>
                        // Initialize and add the map
                        function initMap() {


                            var latlong = localStorage.getItem('geotienda'); 
                            var arreglo = latlong.split(",");
                            var latitud = parseFloat(arreglo[0]);
                            var longitud = parseFloat(arreglo[1]);





                            // The location of Uluru
                            var uluru = {lat: latitud, lng: longitud};
                            // The map, centered at Uluru
                            var map = new google.maps.Map(
                                document.getElementById('map'), {zoom: 18, center: uluru});
                            // The marker, positioned at Uluru
                            var marker = new google.maps.Marker({position: uluru, map: map, title: ''});
                        }
                    </script>
